name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_ledger_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # The repo uses npm (per package-lock.json) — not pnpm despite
      # CLAUDE.md mentioning pnpm. CI follows the artifact reality.
      # If we ever switch to pnpm, generate pnpm-lock.yaml and revert
      # this to pnpm/action-setup@v4 + cache: pnpm.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed
      - run: npm test
