name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_ledger_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # The repo's lockfile is `package-lock.json` (npm). A previous
      # iteration of this workflow used pnpm, but no `pnpm-lock.yaml`
      # was ever committed, so `pnpm install --frozen-lockfile` failed
      # in ~5s on every PR. Switched to npm to match the actual repo.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # SOC 2 CC8 — schema-drift detection. The committed fingerprint
      # MUST match prisma/schema.prisma; any schema change must update
      # the fingerprint in the same PR.
      - name: Schema fingerprint check
        run: ./scripts/check-schema-fingerprint.sh

      - run: npx prisma generate
      # Schema-only sync. We deliberately use `db push` not `migrate
      # deploy` here: migration 0001_constraints references old table
      # names (`gl_entry_line`) that the current schema renamed via
      # @@map (`journal_line`). That migration history is fine for
      # production rollouts but won't replay against a fresh DB.
      - run: npx prisma db push --skip-generate

      # Migration-only DDL (append-only triggers/rules, CHECK
      # constraints, GIN + partial unique indexes) that `prisma db
      # push` cannot create — Prisma's schema language can't express
      # them. db:restore-ddl applies the prisma/sql/ DDL files; the
      # same command recovers a database after `db:reset`. Adding
      # migration-only DDL in a new migration? Add it to
      # prisma/sql/migration-mirror.sql (idempotently) and this step
      # picks it up.
      - name: Apply migration-mirror DDL
        run: npm run db:restore-ddl

      # The seed self-bootstraps the default tenant + owner user
      # (ensureDefaultTenant) — the rows migration 0002_multi_tenancy's
      # DO block would create in a migrate-deploy world. Running it
      # against this fresh database is what proves the bootstrap path
      # works.
      - run: npm run db:seed
      - run: npm test

      # Production build. tsc and vitest both pass on code Next.js will
      # refuse to build — the "use server" export rule is enforced by the
      # bundler, not the type system — so without this step a deploy-
      # breaking change lands on main green. That is exactly how
      # ATTACHMENT_ACCEPT_HINT (a non-async export from an actions file)
      # got in and sat there.
      #
      # Needs a DATABASE_URL because route modules are evaluated during
      # the build; the job's Postgres service is already up.
      - name: Production build
        run: npx next build
