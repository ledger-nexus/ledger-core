name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_ledger_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # The repo's lockfile is `package-lock.json` (npm). A previous
      # iteration of this workflow used pnpm, but no `pnpm-lock.yaml`
      # was ever committed, so `pnpm install --frozen-lockfile` failed
      # in ~5s on every PR. Switched to npm to match the actual repo.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      # `migrate deploy` runs every migration including 0002_multi_tenancy,
      # which inserts the default tenant the Northwind seed requires.
      # `db push` would only sync the schema, leaving that tenant absent
      # and causing the seed to fail with `Default tenant (slug="default")
      # not found`.
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test
