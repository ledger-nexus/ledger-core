name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_ledger_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # The repo's lockfile is `package-lock.json` (npm). A previous
      # iteration of this workflow used pnpm, but no `pnpm-lock.yaml`
      # was ever committed, so `pnpm install --frozen-lockfile` failed
      # in ~5s on every PR. Switched to npm to match the actual repo.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      # Schema-only sync. We deliberately use `db push` not `migrate
      # deploy` here: migration 0001_constraints references old table
      # names (`gl_entry_line`) that the current schema renamed via
      # @@map (`journal_line`). That migration history is fine for
      # production rollouts but won't replay against a fresh DB.
      - run: npx prisma db push --skip-generate

      # Bootstrap a user + default tenant. The Northwind seed AND
      # several integration tests call `getDefaultTenantId()` which
      # expects `tenant.slug='default'` to exist. In production this
      # row is created by migration 0002_multi_tenancy's DO block —
      # which we just skipped (see comment above). Inline the
      # essential rows here so the rest of the CI pipeline can run.
      - name: Bootstrap default tenant
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mini_ledger_test <<'SQL'
          INSERT INTO "app_user" ("id", "email", "displayName", "isActive", "createdAt", "updatedAt")
          VALUES (gen_random_uuid(), 'ci-bootstrap@northwind.test', 'CI Bootstrap', TRUE, NOW(), NOW())
          ON CONFLICT ("email") DO NOTHING;

          INSERT INTO "tenant" ("id", "slug", "name", "ownerUserId", "createdAt", "updatedAt")
          SELECT gen_random_uuid(), 'default', 'Default Tenant', id, NOW(), NOW()
          FROM "app_user" WHERE "email" = 'ci-bootstrap@northwind.test'
          ON CONFLICT ("slug") DO NOTHING;
          SQL

      # Install append-only triggers. Migration SQL files create these
      # in deployed environments, but `prisma db push` (used above for
      # the schema sync) skips migration SQL entirely and only mirrors
      # the schema.prisma datamodel. Prisma's schema language can't
      # express triggers — so each new append-only trigger added to a
      # migration needs a mirror block here so the test runner can
      # actually probe the enforcement.
      #
      # Adding a new trigger: copy the CREATE FUNCTION + CREATE TRIGGER
      # statements from your migration SQL into this step. Use
      # DROP TRIGGER IF EXISTS for idempotency.
      - name: Install append-only triggers (migration 0011)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mini_ledger_test <<'SQL'
          CREATE OR REPLACE FUNCTION "close_task_state_change_block_mutation"()
          RETURNS TRIGGER AS $$
          BEGIN
            IF TG_OP = 'DELETE' AND pg_trigger_depth() > 1 THEN
              RETURN OLD;
            END IF;
            RAISE EXCEPTION
              'close_task_state_change is append-only — % blocked',
              TG_OP;
          END;
          $$ LANGUAGE plpgsql;

          DROP TRIGGER IF EXISTS "close_task_state_change_no_update"
            ON "close_task_state_change";
          CREATE TRIGGER "close_task_state_change_no_update"
            BEFORE UPDATE ON "close_task_state_change"
            FOR EACH ROW EXECUTE FUNCTION "close_task_state_change_block_mutation"();

          DROP TRIGGER IF EXISTS "close_task_state_change_no_delete"
            ON "close_task_state_change";
          CREATE TRIGGER "close_task_state_change_no_delete"
            BEFORE DELETE ON "close_task_state_change"
            FOR EACH ROW EXECUTE FUNCTION "close_task_state_change_block_mutation"();
          SQL

      - run: npm run db:seed
      - run: npm test
