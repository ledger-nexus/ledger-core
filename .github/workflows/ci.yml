name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mini_ledger_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # The repo's lockfile is `package-lock.json` (npm). A previous
      # iteration of this workflow used pnpm, but no `pnpm-lock.yaml`
      # was ever committed, so `pnpm install --frozen-lockfile` failed
      # in ~5s on every PR. Switched to npm to match the actual repo.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      # Schema-only sync. We deliberately use `db push` not `migrate
      # deploy` here: migration 0001_constraints references old table
      # names (`gl_entry_line`) that the current schema renamed via
      # @@map (`journal_line`). That migration history is fine for
      # production rollouts but won't replay against a fresh DB.
      - run: npx prisma db push --skip-generate

      # Bootstrap a user + default tenant. The Northwind seed AND
      # several integration tests call `getDefaultTenantId()` which
      # expects `tenant.slug='default'` to exist. In production this
      # row is created by migration 0002_multi_tenancy's DO block —
      # which we just skipped (see comment above). Inline the
      # essential rows here so the rest of the CI pipeline can run.
      - name: Bootstrap default tenant
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d mini_ledger_test <<'SQL'
          INSERT INTO "app_user" ("id", "email", "displayName", "isActive", "createdAt", "updatedAt")
          VALUES (gen_random_uuid(), 'ci-bootstrap@northwind.test', 'CI Bootstrap', TRUE, NOW(), NOW())
          ON CONFLICT ("email") DO NOTHING;

          INSERT INTO "tenant" ("id", "slug", "name", "ownerUserId", "createdAt", "updatedAt")
          SELECT gen_random_uuid(), 'default', 'Default Tenant', id, NOW(), NOW()
          FROM "app_user" WHERE "email" = 'ci-bootstrap@northwind.test'
          ON CONFLICT ("slug") DO NOTHING;
          SQL

      - run: npm run db:seed
      - run: npm test
